[hyper-lin]
languages              = ["english", "russian", "ukrainian", "chinese"]
use_fcitx5             = true
paru_enabled           = true
nvidia_enabled         = true
zsh_enabled            = true
base_tools_enabled     = true
advanced_tools_enabled = true
niri_enabled           = true
libvirt_enabled        = false
dev_tools_enabled      = true
rbw_enabled            = true
yubikey_enabled        = true
tailscale_enabled      = true
winpodx_enabled        = true

[hyper-lin.ram]
zram_enabled           = true
zram_size              = 8192
zram_algo              = "zstd"
hugepages_enabled      = true
hugepages_mode         = "thp"
thp_mode               = "madvise"

[hyper-lin.pacman]
multilib_enabled = true
parallel         = 4

[hyper-lin.reflector]
countries = "Ukraine,Poland,Slovakia"
sort      = "rate"
servers   = 20

[hyper-lin.ai.clients]
claude_desktop = true
claude_code    = true

[echo-server]
paru_enabled           = true
nvidia_enabled         = true
zsh_enabled            = true
base_tools_enabled     = true
advanced_tools_enabled = false
niri_enabled           = false
libvirt_enabled        = true
dev_tools_enabled      = false
rbw_enabled            = false
yubikey_enabled        = false
tailscale_enabled      = true
winpodx_enabled        = false

[echo-server.ram]
zram_enabled           = true
zram_size              = 6144
zram_algo              = "zstd"
hugepages_enabled      = true
hugepages_mode         = "static"
hugepages_count        = 2048

[echo-server.pacman]
multilib_enabled = true
parallel         = 2

[echo-server.reflector]
countries = "Ukraine,Poland"
sort      = "rate"
servers   = 10

[echo-server.ai.clients]
claude_desktop = false
claude_code    = false
