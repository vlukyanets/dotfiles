# Per-host configuration. Hostname is the top-level table key. Every field
# is optional — anything omitted falls back to the default hardcoded in
# .chezmoi.toml.tmpl (there's no shared [default] table here; that's where
# defaults live instead).
#
# Recognized fields:
#   [<host>.git.user]
#     name   string  git user.name (default: "Valentin Lukyanets")
#     email  string  git user.email (no default — omitted means an empty
#                     value, not a shared fallback address)
#   [<host>.pkg-mgmt.pacman]
#     parallel-downloads  int     pacman.conf ParallelDownloads (default: 5)
#                                 — a fixed integer only; pacman.conf isn't
#                                 shell, so it can't take the percentage or
#                                 shell-expression forms makepkg.jobs does
#                                 below (chezmoi init fails loudly if given
#                                 e.g. "20%")
#   [<host>.pkg-mgmt.makepkg]
#     jobs   int or string  makepkg.conf MAKEFLAGS="-j<value>" (default: "$(nproc)"),
#                    any of:
#                      - a plain integer (4, not quoted)  — used as-is
#                      - a percentage of CPU count ("20%", a string) —
#                        resolved to floor(cpus * pct/100), clamped up to a
#                        minimum of 1 whenever the percentage is > 0%
#                      - a raw shell expression ("$(nproc)", a string, the
#                        default) — written through unresolved and evaluated
#                        fresh at every build instead of once at apply time,
#                        since makepkg.conf (unlike pacman.conf) is sourced
#                        as shell
#     options  list of strings  entries for makepkg.conf's OPTIONS array,
#                    e.g. ["ccache", "!debug"] (a leading "!" negates one of
#                    makepkg's built-in defaults, same as in OPTIONS=(...)
#                    itself). Joined into one OPTIONS+=(...) line. Default:
#                    [] — no line at all, makepkg's own OPTIONS stand as-is.
#   [<host>.pkg-mgmt.reflector]
#     save     string  reflector --save, the mirrorlist path (default:
#                    "/etc/pacman.d/mirrorlist"). Shared with
#                    run_once_before_00-configure-pacman.sh.tmpl's multilib
#                    Include= line, so the two stay pointed at the same file
#                    — override here, not in that script.
#                    CAUTION: the reflector package's own reflector.service
#                    is systemd-sandboxed with a hardcoded
#                    ReadWritePaths=/etc/pacman.d/mirrorlist (ProtectSystem=
#                    strict). Our own run_once script writes here fine
#                    regardless (plain sudo, no sandbox), but every later
#                    *timer*-triggered run would silently fail to write
#                    anywhere else — don't set this to a non-default path
#                    without also shipping a drop-in that widens
#                    reflector.service's ReadWritePaths to match.
#     country  list of strings  reflector --country, e.g. ["Germany", "France"]
#                    (default: [] — flag omitted, reflector considers every
#                    country)
#     protocol           string  reflector --protocol (default: "https")
#     latest             int     reflector --latest (default: 20)
#     sort               string  reflector --sort (default: "rate")
#     age                int     reflector --age, hours (default: 12)
#     download-timeout   int     reflector --download-timeout, seconds
#                    (default: 5)
#   [<host>.pkg-mgmt.reflector.timer]
#     on-calendar  string  reflector.timer OnCalendar= override (default:
#                    "weekly", the package's own default)
#     on-boot-sec  string  reflector.timer OnBootSec= override (default:
#                    "15min", the package's own default)
#
# To register a new machine, add a [<hostname>] table below (it can be
# empty — its presence is what marks the host as known). `chezmoi init`
# fails outright on any hostname not listed here — it does not prompt and
# does not fall back to the defaults above.

[hyper-lin]

[hyper-lin.git]
user.name = "Valentin Lukyanets"
user.email = "valikluks95@gmail.com"

[hyper-lin.pkg-mgmt.pacman]
parallel-downloads = 2

[hyper-lin.pkg-mgmt.makepkg]
jobs = "20%"

[hyper-lin.pkg-mgmt.reflector]
country = ["Ukraine", "Poland", "Slovakia"]

# --- examples for future machines (uncomment and adjust) -------------------
#
# [homelab]
# [homelab.pkg-mgmt.makepkg]
# jobs    = 2     # low-memory box: cap build parallelism instead of using every core
# options = ["ccache", "!debug"]
