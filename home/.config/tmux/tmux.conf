# Managed by dotfiles — edit home/.config/tmux/tmux.conf in the repo, not this file.
# Reload inside a running session with prefix + r.

# Terminal: advertise 256 colors + truecolor to programs inside tmux. The
# terminal-features line tells tmux the outer terminal (kitty, TERM=
# xterm-kitty) actually supports RGB, which it doesn't assume for unknown
# TERM values.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB"

# C-a instead of C-b: reachable without stretching, and C-b is nvim's
# page-up. C-a C-a sends a literal C-a through to the pane (shell
# beginning-of-line).
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# No delay after Esc — the default 500ms makes neovim's mode switch lag.
set -sg escape-time 0

set -g mouse on
set -g history-limit 50000
set -g focus-events on

# Number windows/panes from 1 (0 is at the far end of the keyboard) and
# close gaps when one is killed.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# vi keys in copy mode, matching $EDITOR=nvim.
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Splits that look like what they do, opening in the current pane's
# directory rather than the one the session started in.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# vi-style pane navigation.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# Status bar: plain, no plugins.
set -g status-position bottom
set -g status-style "bg=default,fg=default"
set -g status-left "#[bold][#S] "
set -g status-right " %H:%M "
setw -g window-status-current-style "bold,reverse"
