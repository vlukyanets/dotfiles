# What every host gets. Values that depend on where or what the machine is
# belong to the host.

[features.reflector]
enabled = true

[features.rustup]
enabled = true

[features.paru]
enabled = true

[features.no_beep]
enabled = true

[features.zsh]
enabled = true

[features.zsh.theme]
name = "powerlevel10k/powerlevel10k"
repo = "https://github.com/romkatv/powerlevel10k.git"
