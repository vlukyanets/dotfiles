# What every host gets. Values that depend on where or what the machine is
# belong to the host.

[features.reflector]
enabled = true

[features.rustup]
enabled = true

[features.paru]
enabled = true

[features.no_beep]
enabled = true

[features.pkgfile]
enabled = true

[features.zsh]
enabled = true

[features.command_not_found]
enabled = true
