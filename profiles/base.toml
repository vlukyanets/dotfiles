# What every host gets, on any platform; profiles/arch.toml adds Arch's
# own. Values that depend on where or what the machine is belong to the host.

[features.development.rustup]
enabled = true

[features.system.no_beep]
enabled = true

[features.shell.zsh]
enabled = true

[features.development.git]
enabled = true

[features.system.locale]
enabled  = true
timezone = "Europe/Kyiv"

[features.system.timesyncd]
enabled = true
