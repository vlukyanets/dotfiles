[project]
name = "dotfiles"
version = "0.1.0"
description = "My machines' configuration, kept as plain copies of their files"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
dotfiles = "dotfiles.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pyfakefs>=6.2.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
files = ["dotfiles", "tests"]
