[project]
name = "dotfiles"
version = "0.1.0"
description = "Takes an Arch Linux machine from a fresh install to a configured one"
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1",
    "tomli-w>=1.0",
]

[project.scripts]
dotfiles = "dotfiles.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

# Flat layout: `python -m dotfiles` works from a checkout with no install.
[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]

[tool.uv]
# .venv/ runs the tool; tests and lint bring the dev group in a throwaway
# environment of their own (uv run --isolated --group dev).
default-groups = []
