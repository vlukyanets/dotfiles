# Every key a host or profile may set, with its default value.
#
# This file is the schema. profiles/*.toml and hosts/*.toml override it, and
# a key that is not here — or has a different type here — fails naming the
# file and the key. Every feature is a table under [features] whose
# `enabled` defaults to false, so a host without a file in hosts/ gets
# dotfiles and nothing else. A feature with no settings is one dotted key,
# `docker.enabled = false`; one with settings has its own [features.<name>]
# table.

[git]
name  = ""
email = ""

[secrets]
# "none" or "rbw": with rbw, ~/.config/rbw/config.json is deployed.
backend = "none"

[ssh]
# Machines that may log in here, by name from the ssh-keys registry.
# Empty leaves ~/.ssh/authorized_keys unmanaged.
authorized_keys = []

[features.packaging]
enabled = false  # drop-ins in /etc/pacman.conf.d and /etc/makepkg.conf.d

# A setting left at its default writes nothing: pacman.conf and
# makepkg.conf keep their own value.
[features.packaging.pacman]
parallel_downloads = 0      # ParallelDownloads
multilib           = false  # the [multilib] repository
# Options pacman takes without a value, on by their presence alone:
# "Color", "VerbosePkgLists", "CheckSpace", "ILoveCandy", ...
flags              = []

[features.packaging.makepkg]
jobs     = 0   # MAKEFLAGS=-jN: threads, or "50%" of the cores (at least 1)
packager = ""  # PACKAGER, "Name <email>"
options  = []  # OPTIONS+=(...), e.g. ["ccache", "!debug"]
