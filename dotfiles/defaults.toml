# Every key a host or profile may set, with its default value.
#
# This file is the schema. profiles/*.toml and hosts/*.toml override it, and
# a key that is not here — or has a different type here — fails naming the
# file and the key. Every feature is a table under [features] whose
# `enabled` defaults to false, so a host without a file in hosts/ gets
# only the features without an `enabled`, which always run. A feature with no settings is one dotted key,
# `docker.enabled = false`; one with settings has its own [features.<name>]
# table.

# packaging: drop-ins in /etc/pacman.conf.d and /etc/makepkg.conf.d. No
# `enabled`: pacman itself is always there, so it always runs on Arch.
# Its keys but contrib have no default (their types are Packaging.types):
# only a key a host or profile sets is written; pacman.conf and
# makepkg.conf keep the rest.
[features.packaging.pacman]
contrib = false               # pacman-contrib installed too: paccache, checkupdates, pactree, ...
# parallel_downloads = 5      ParallelDownloads, 1 or more
# multilib = true             the [multilib] repository; false takes out only ours
# flags = ["Color"]           options pacman takes without a value, on by their
#                             presence: "Color", "VerbosePkgLists", "ILoveCandy", ...

[features.packaging.makepkg]
# jobs = 8                    MAKEFLAGS=-jN: threads, or "50%" of the cores (at least 1)
# packager = "Name <email>"   PACKAGER
# options = ["ccache"]        OPTIONS+=(...), e.g. ["ccache", "!debug"]

# reflector: /etc/pacman.d/mirrorlist refreshed by reflector.timer, and at
# once when a setting changes.
[features.reflector]
enabled            = false
country            = []        # names or codes, e.g. ["Germany", "PL"]; empty: every country
protocol           = "https"   # https, http, rsync or ftp
latest             = 20        # the N mirrors synced most recently
sort               = "rate"    # age, rate, country, score or delay
age                = 12        # hours since a mirror last synced, at most
completion_percent = 100       # how complete a mirror must be, 0-100
download_timeout   = 5         # seconds
on_calendar        = "weekly"  # reflector.timer's OnCalendar
on_boot_sec        = "15min"   # and OnBootSec

# no_beep: the PC speaker's drivers (pcspkr, snd_pcsp) blacklisted in
# /etc/modprobe.d/nobeep.conf, and unloaded when loaded.
[features.no_beep]
enabled = false

# git: user.name and user.email in ~/.config/git/dotfiles.gitconfig,
# included from the top of ~/.config/git/config; the rest of the config,
# and ~/.gitconfig, stay the user's and override it. Empty: not written.
[features.git]
enabled = false
name    = ""
email   = ""

# zsh: zsh the login shell (chsh), oh-my-zsh cloned into ~/.oh-my-zsh and
# loaded by ~/.config/zsh/dotfiles.zsh, sourced from the top of ~/.zshrc;
# the rest of ~/.zshrc stays the user's.
[features.zsh]
enabled = false
shell   = "/usr/bin/zsh"  # made the login shell by chsh; listed in /etc/shells
plugins = []              # oh-my-zsh's own plugins
extras  = []              # from the repositories

# The theme: one of oh-my-zsh's own, without a repo; or <dir>/<name>, the
# theme <name> of `repo` cloned into ~/.oh-my-zsh/custom/themes/<dir>, again
# whenever its URL or branch differs. Of the user's files zsh writes only
# ~/.config/zsh/dotfiles.zsh and its line in ~/.zshrc: whatever a theme
# needs besides is the user's, set up in ~/.zshrc.
[features.zsh.theme]
name   = "robbyrussell"
repo   = ""  # an https git URL; empty: built in
branch = ""  # empty: the repo's default

# rustup: cargo and rustc from rustup in place of rust, with `toolchain`
# installed and the default.
[features.rustup]
enabled   = false
toolchain = "stable"  # stable, beta, nightly, a version ("1.85.0") or a dated nightly

# paru: the AUR helper, built from the AUR by makepkg as the user and
# installed by pacman as root, whenever `paru --version` does not run.
# Requires packaging, for makepkg's flags, and rustup, for cargo.
[features.paru]
enabled = false
