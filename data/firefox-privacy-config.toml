# Firefox about:config defaults, written by features.firefox as the
# "Preferences" policy of /usr/lib/firefox/distribution/policies.json.
# Sourced from arkenfox/user.js (https://github.com/arkenfox/user.js), its
# non-OPTIONAL sections only. Every value replaces the pref's *default*
# ("Status": "default"): nothing is locked, about:config stays editable.
# Skipped: Windows/macOS-only prefs and the "Clear Data" dialog checkbox
# defaults (cosmetic).

[firefox.prefs]
# 0100: startup / new tab
"browser.startup.page" = 0
"browser.startup.homepage" = "chrome://browser/content/blanktab.html"
"browser.newtabpage.enabled" = false
"browser.newtabpage.activity-stream.showSponsored" = false
"browser.newtabpage.activity-stream.showSponsoredTopSites" = false
"browser.newtabpage.activity-stream.showSponsoredCheckboxes" = false
"browser.newtabpage.activity-stream.default.sites" = ""
# 0200: geolocation (geoclue is the Linux provider; Windows/macOS ones dropped)
"geo.provider.use_geoclue" = false
# 0300: quieter fox — recommendations, studies, crash/captive-portal pings
"extensions.getAddons.showPane" = false
"extensions.htmlaboutaddons.recommendations.enabled" = false
"browser.discovery.enabled" = false
"browser.newtabpage.activity-stream.feeds.telemetry" = false
"browser.newtabpage.activity-stream.telemetry" = false
"app.shield.optoutstudies.enabled" = false
"app.normandy.enabled" = false
"app.normandy.api_url" = ""
"breakpad.reportURL" = ""
"browser.tabs.crashReporting.sendReport" = false
"browser.crashReports.unsubmittedCheck.autoSubmit2" = false
"captivedetect.canonicalURL" = ""
"network.captive-portal-service.enabled" = false
"network.connectivity-service.enabled" = false
# 0400: safe browsing — keep malware/phish list checks, drop remote download checks
"browser.safebrowsing.downloads.remote.enabled" = false
# 0600: block implicit outbound (prefetch/preconnect/speculative loads)
"network.prefetch-next" = false
"network.dns.disablePrefetch" = true
"network.dns.disablePrefetchFromHTTPS" = true
"network.http.speculative-parallel-limit" = 0
"browser.places.speculativeConnect.enabled" = false
# 0700: DNS / proxy
"network.proxy.socks_remote_dns" = true
"network.gio.supported-protocols" = ""
# 0800: location bar / search suggestions / Firefox Suggest
"browser.urlbar.speculativeConnect.enabled" = false
"browser.urlbar.quicksuggest.enabled" = false
"browser.urlbar.suggest.quicksuggest.nonsponsored" = false
"browser.urlbar.suggest.quicksuggest.sponsored" = false
"browser.search.suggest.enabled" = false
"browser.urlbar.suggest.searches" = false
"browser.urlbar.trending.featureGate" = false
"browser.urlbar.addons.featureGate" = false
"browser.urlbar.amp.featureGate" = false
"browser.urlbar.importantDates.featureGate" = false
"browser.urlbar.market.featureGate" = false
"browser.urlbar.mdn.featureGate" = false
"browser.urlbar.weather.featureGate" = false
"browser.urlbar.wikipedia.featureGate" = false
"browser.urlbar.yelp.featureGate" = false
"browser.urlbar.yelpRealtime.featureGate" = false
"browser.formfill.enable" = false
"browser.search.separatePrivateDefault" = true
"browser.search.separatePrivateDefault.ui.enabled" = true
# 0900: passwords / passkeys
"signon.autofillForms" = false
"signon.formlessCapture.enabled" = false
"network.auth.subresource-http-auth-allow" = 1
"security.webauthn.always_allow_direct_attestation" = false
# 1000: disk avoidance — nothing browsing-related touches disk
"browser.cache.disk.enable" = false
"browser.privatebrowsing.forceMediaMemoryCache" = true
"media.memory_cache_max_size" = 65536
"browser.sessionstore.privacy_level" = 2
"browser.shell.shortcutFavicons" = false
# 1200: HTTPS / TLS / certs
"security.ssl.require_safe_negotiation" = true
"security.tls.enable_0rtt_data" = false
"security.cert_pinning.enforcement_level" = 2
"security.remote_settings.crlite_filters.enabled" = true
"security.pki.crlite_mode" = 2
"dom.security.https_only_mode" = true
"dom.security.https_only_mode_send_http_background_request" = false
"security.ssl.treat_unsafe_negotiation_as_broken" = true
"browser.xul.error_pages.expert_bad_cert" = true
# 1600: strip path/query from cross-origin referers
"network.http.referer.XOriginTrimmingPolicy" = 2
# 1700: containers (Firefox Multi-Account Containers UI)
"privacy.userContext.enabled" = true
"privacy.userContext.ui.enabled" = true
# 2000: WebRTC — no local/VPN IP leaked via ICE candidates
"media.peerconnection.ice.proxy_only_if_behind_proxy" = true
"media.peerconnection.ice.default_address_only" = true
# 2400: DOM
"dom.disable_window_move_resize" = true
# 2600: misc — downloads, devtools remote debugging, download prompts
"browser.download.start_downloads_in_tmp_dir" = true
"browser.helperApps.deleteTempFileOnExit" = true
"browser.uitour.enabled" = false
"devtools.debugger.remote-enabled" = false
"permissions.manager.defaultsUrl" = ""
"network.IDN_show_punycode" = true
"pdfjs.enableScripting" = false
"browser.tabs.searchclipboardfor.middleclick" = false
"browser.contentanalysis.enabled" = false
"privacy.antitracking.isolateContentScriptResources" = true
"security.csp.reporting.enabled" = false
"browser.download.useDownloadDir" = false
"browser.download.alwaysOpenPanel" = false
"browser.download.manager.addToRecentDocs" = false
"browser.download.always_ask_before_handling_new_types" = true
"extensions.enabledScopes" = 5
"extensions.postDownloadThirdPartyPrompt" = false
# 2700: Enhanced Tracking Protection, forced to strict
"browser.contentblocking.category" = "strict"
"privacy.trackingprotection.allow_list.baseline.enabled" = true
"privacy.trackingprotection.allow_list.convenience.enabled" = true
# 2800: sanitize cache/cookies/form-data on every shutdown (history and
# downloads are deliberately left alone — arkenfox's own default split)
"privacy.sanitize.sanitizeOnShutdown" = true
"privacy.clearOnShutdown_v2.cache" = true
"privacy.clearOnShutdown_v2.historyFormDataAndDownloads" = false
"privacy.clearOnShutdown_v2.browsingHistoryAndDownloads" = false
"privacy.clearOnShutdown_v2.downloads" = false
"privacy.clearOnShutdown_v2.formdata" = true
"privacy.clearOnShutdown_v2.cookiesAndStorage" = true
"privacy.sanitize.timeSpan" = 0
# 8500: telemetry, off end to end
"datareporting.policy.dataSubmissionEnabled" = false
"datareporting.healthreport.uploadEnabled" = false
"toolkit.telemetry.unified" = false
"toolkit.telemetry.enabled" = false
"toolkit.telemetry.server" = "data:,"
"toolkit.telemetry.archive.enabled" = false
"toolkit.telemetry.newProfilePing.enabled" = false
"toolkit.telemetry.shutdownPingSender.enabled" = false
"toolkit.telemetry.updatePing.enabled" = false
"toolkit.telemetry.bhrPing.enabled" = false
"toolkit.telemetry.firstShutdownPing.enabled" = false
"toolkit.telemetry.coverage.opt-out" = true
"toolkit.coverage.opt-out" = true
"toolkit.coverage.endpoint.base" = ""
# 9000: non-project-specific cleanup (update-notice mstone, CFR recommendations)
"browser.startup.homepage_override.mstone" = "ignore"
"browser.newtabpage.activity-stream.asrouter.userprefs.cfr.addons" = false
"browser.newtabpage.activity-stream.asrouter.userprefs.cfr.features" = false
"browser.urlbar.showSearchTerms.enabled" = false

