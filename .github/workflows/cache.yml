name: cache

# The one job that saves uv's cache; every other job only restores it, so
# no two jobs race to save the same key. Pull requests read master's cache.
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  uv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.24"
          python-version: "3.12"
      - run: uv sync --frozen
