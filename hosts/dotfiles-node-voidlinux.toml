# A test node: a Void Linux VM, a distribution without systemd.
#
# dotfiles has no Void platform yet (dotfiles/platforms/void.py), so today
# `apply` stops before any change with `no platform for void`.
# What to try here:
# - `dotfiles init dotfiles-node-voidlinux`, `config`, `check`.
# - `render --out DIR`, `deploy --dry-run`, `deploy`: the dotfiles in $HOME,
#   and a second deploy that changes nothing.
# - `apply --dry-run`: the error above, with nothing changed.
# - Once a Void platform exists: xbps setup and install, and every place
#   that assumes systemd — `Linux.ensure_service` (runit services instead),
#   sysctl.d, the `Linux` strategies of nobeep, oomd, thp, timesyncd and
#   resolved — which a Void platform has to override or skip.
extends = ["vm"]
