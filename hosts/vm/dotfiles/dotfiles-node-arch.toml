# A test node: an Arch VM to run the whole tool on before a real machine.
#
# What to try here:
# - `dotfiles init dotfiles-node-arch`, then `config`, `config --explain`:
#   the chain vm → base and the values each file sets.
# - `apply --dry-run`, then `apply`: the dotfiles deployed and the enabled
#   features run; a second `apply` prints only `nothing to change` and
#   asks no password.
extends = ["vm"]

[git]
name = "Dotfiles Node Arch"
email = "no.email.arch@hosting.net"

[features.packaging.pacman]
parallel_downloads = 2

[features.packaging.makepkg]
jobs = 1
packager = "Dotfiles Node Arch <no.email.arch@hosting.net>"